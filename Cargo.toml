[package]
name = "gitk-rs"
# The displayed application/package version appends the short Git revision.
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A streaming Git history explorer built with GPUI"

[features]
default = ["system-fonts"]
# Resolve Linux font defaults when Fontconfig is available; otherwise use built-in defaults.
system-fonts = ["dep:fontconfig"]

[dependencies]
gpui-kit = { version = "=0.9.1", features = ["gpui-fast"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
toml = "1"
tempfile = "3"
# Syntaxes and themes come from two-face; no source-format loaders or HTML export.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13"
notify = "8"
regex = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig = { version = "0.11", optional = true, features = ["dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSFont", "NSFontDescriptor", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["gpui-fast", "test-support"] }

[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "deny"
