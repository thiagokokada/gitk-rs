[package]
name = "gitk-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A streaming Git history explorer built with GPUI"

[features]
# SDK-only and sandboxed builds remain usable without Apple's Metal compiler.
# Disable default features to embed build-time compiled shaders on macOS.
default = ["runtime-shaders"]
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
gpui = { version = "=0.2.2", default-features = false }
gpui-component = { version = "=0.5.1", default-features = false }
gpui-component-assets = "=0.5.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13"
notify = "7"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }

[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"

# GPUI's zed-async-tar dependency requires xattr 0.2. Linux uses ENODATA;
# newer libc releases no longer export the obsolete ENOATTR alias.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
