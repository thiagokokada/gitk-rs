name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: ${{ matrix.os }} / Cargo
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libclang-dev git \
            libfontconfig1-dev libfreetype6-dev libssl-dev zlib1g-dev libwayland-dev \
            libxcb1-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libvulkan-dev fonts-dejavu-core

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config

      - name: Install stable Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "version=$(rustc --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-

      - name: Build
        run: cargo build --locked

      - name: Test without a display
        run: env -u DISPLAY -u WAYLAND_DISPLAY cargo test --all-targets --locked

      - name: Check executable
        run: ./target/debug/gitk-rs --version

  nix:
    name: ${{ matrix.os }} / Nix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: ${{ runner.os == 'Linux' && 'extra-system-features = kvm nixos-test' || '' }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # Save each commit's store; restore earlier compiled dependencies.
          primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'Cargo.toml', 'vendor/**') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'Cargo.toml', 'vendor/**') }}-
            nix-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build package and run Rust tests
        run: nix build --print-build-logs

      - name: Check formatting, linting, and scripts
        run: nix flake check --print-build-logs

      - name: Run the X11 GUI smoke test in a VM
        if: runner.os == 'Linux'
        run: nix build .#gui-smoke --out-link result-gui-smoke --print-build-logs 2>&1 | tee gui-smoke-build.log

      - name: Upload GUI smoke screenshots and logs
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: gui-smoke-x11
          path: |
            gui-smoke-build.log
            result-gui-smoke/artifacts/gui-smoke/
          if-no-files-found: ignore
