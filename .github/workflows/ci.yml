name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: ${{ matrix.os }} / Cargo
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libclang-dev git \
            libfontconfig1-dev libfreetype6-dev libssl-dev zlib1g-dev libwayland-dev \
            libxcb1-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libvulkan-dev fonts-dejavu-core

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config

      - name: Install stable Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "version=$(rustc --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-

      - name: Build
        run: cargo build --locked

      - name: Test without a display
        run: env -u DISPLAY -u WAYLAND_DISPLAY cargo test --all-targets --locked

      - name: Check executable
        run: ./target/debug/gitk-rs --version

  nix:
    name: ${{ matrix.os }} / Nix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix develop --command cargo fmt --all -- --check

      - name: Clippy
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings

      - name: Test without a display
        run: nix develop --command env -u DISPLAY -u WAYLAND_DISPLAY cargo test --all-targets --locked

      - name: Check flake and package
        run: nix flake check --print-build-logs
